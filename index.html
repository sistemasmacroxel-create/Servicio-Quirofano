<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<title>MACROXEL Servicio Quirófano</title>
<style>html,body{margin:0;width:100%;height:100%;background:#03142b}#mxLoader{position:fixed;inset:0;display:grid;place-items:center;color:#fff;font:600 14px system-ui;background:#03142b;text-align:center;padding:24px}</style>
</head>
<body>
<div id="mxLoader">Conectando con Macroxel Hospital…</div>
<script>
/* MACROXEL v257 · enlace operativo dinámico + navegación segura al visor central */
(()=>{'use strict';
  const LICENSE_HOST='licenciasmacroxel-default-rtdb.firebaseio.com';
  const CENTRAL_REPO='ECOSISTEMA-MACROXEL-HOSPITAL';
  const TARGET_PATH='/'+CENTRAL_REPO+'/MACROXEL-VISORES-CENTRAL/QUIROFANO-STOCK-ANTIBIOTICOS/';
  const originRoute=location.origin+location.pathname.replace(/\/index\.html?$/i,'/').replace(/\/+$/,'')+'/';
  const routeKey='mx_route_operational_db_v1208::'+originRoute;
  const systemKey='mx_route_system_id_v257::'+originRoute;
  const clean=v=>String(v||'').trim().replace(/\.json\/?$/i,'').replace(/\/+$/,'');
  const validDb=v=>{try{const u=new URL(clean(v)),h=u.hostname.toLowerCase();return u.protocol==='https:'&&/(?:firebaseio\.com|firebasedatabase\.app)$/i.test(h)&&h!==LICENSE_HOST&&h!=='ecosistema-macroxel-default-rtdb.firebaseio.com'?clean(v):''}catch(_e){return''}};
  const validSystem=v=>{const s=String(v||'').trim().toUpperCase().replace(/[.#$\[\]\/]/g,'_');return /^MACROXEL-[A-Z0-9_-]{4,}$/.test(s)?s:''};
  const q=new URLSearchParams(location.search);
  const dbFromPrincipal=validDb(q.get('mxDb')||q.get('firebase')||q.get('db'));
  const systemFromPrincipal=validSystem(q.get('mxSystem')||q.get('mxPrincipal')||q.get('mxSystemId')||q.get('system'));
  let dbSaved='',systemSaved='';
  try{dbSaved=validDb(localStorage.getItem(routeKey));systemSaved=validSystem(localStorage.getItem(systemKey))}catch(_e){}
  const target=new URL(TARGET_PATH,location.origin);
  // Si el principal cambia de sistema o Firebase, jamás combinamos valores anteriores.
  const changedSystem=!!(systemFromPrincipal&&systemSaved&&systemFromPrincipal!==systemSaved);
  const changedDb=!!(dbFromPrincipal&&dbSaved&&dbFromPrincipal!==dbSaved);
  const db=dbFromPrincipal||(q.has('mxDb')||q.has('firebase')||q.has('db')||changedSystem?'':dbSaved);
  const systemId=systemFromPrincipal||(changedDb?'':systemSaved);
  try{if(dbFromPrincipal)localStorage.setItem(routeKey,dbFromPrincipal);if(systemFromPrincipal)localStorage.setItem(systemKey,systemFromPrincipal)}catch(_e){}
  if(db)target.searchParams.set('mxDb',db);
  if(systemId)target.searchParams.set('mxSystem',systemId);
  target.searchParams.set('mxSourceRoute',originRoute);
  for(const k of ['service','initials'])if(q.has(k))target.searchParams.set(k,q.get(k));
  target.hash=location.hash;
  if(target.href===location.href){document.getElementById('mxLoader').textContent='No se pudo abrir la integración del visor.';return}
  location.replace(target.href);
})();
</script>
</body>
</html>
