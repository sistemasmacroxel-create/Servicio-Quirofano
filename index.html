<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Macroxel HPS · Servicio Quirófano</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#03142b}
#mxLoader{position:fixed;inset:0;display:grid;place-items:center;color:#fff;font:600 14px system-ui;background:#03142b}
</style>
</head>
<body>
<div id="mxLoader">Conectando con Macroxel Hospital…</div>
<script>
(()=>{
  const CENTRAL_BASE=location.origin+'/ECOSISTEMA-MACROXEL-HOSPITAL/MACROXEL-VISORES-CENTRAL/QUIROFANO-STOCK-ANTIBIOTICOS/';
  const SOURCE=CENTRAL_BASE+'index.html';
  const CACHE_KEY=SOURCE;

  function render(html){
    if(!/<html(?:\s|>)/i.test(html)) throw new Error('Contenido central inválido');
    if(!/<base\s/i.test(html)){
      html=html.replace(/<head([^>]*)>/i,'<head$1><base href="'+CENTRAL_BASE+'">');
    }
    document.open();
    document.write(html);
    document.close();
  }

  (async()=>{
    try{
      const r=await fetch(SOURCE+'?mx='+Date.now(),{cache:'no-store'});
      if(!r.ok) throw new Error('HTTP '+r.status);
      const html=await r.text();
      if('caches' in window){
        try{
          const c=await caches.open('macroxel-hospital-central');
          await c.put(CACHE_KEY,new Response(html,{headers:{'Content-Type':'text/html; charset=utf-8'}}));
        }catch(_){}
      }
      render(html);
    }catch(err){
      if('caches' in window){
        try{
          const cached=await caches.match(CACHE_KEY);
          if(cached){ render(await cached.text()); return; }
        }catch(_){}
      }
      const loader=document.getElementById('mxLoader');
      if(loader) loader.innerHTML='No se pudo cargar Macroxel Hospital.<br><small style="opacity:.75">Verifica la conexión y vuelve a abrir el visor.</small>';
      console.error(err);
    }
  })();
})();
</script>
</body>
</html>
